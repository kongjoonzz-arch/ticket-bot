<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket Dashboard</title><style>:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--acc:#5865F2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif}.wrap{max-width:1080px;margin:0 auto;padding:24px}h1{font-size:22px}h2{font-size:16px;margin:28px 0 10px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,textarea{background:#0b1220;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:14px}input{min-width:120px}textarea{width:100%;min-height:64px}button{background:var(--acc);border:0;color:#fff;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}button.ghost{background:#334155}button.danger{background:#ed4245}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left}.hint{color:#94a3b8;font-size:13px}.lock{max-width:420px;margin:80px auto;text-align:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style></head><body><div class="wrap"><div id="lock" class="card lock"><h1>Ticket Dashboard</h1><p class="hint">PASSWORD</p><div class="row" style="justify-content:center"><input type="password" id="pw" placeholder="password"><button onclick="login()">Login</button></div></div><div id="app" style="display:none"><h1>Ticket Dashboard</h1><div class="row"><button onclick="loadAll()">Refresh</button><span id="msg" class="hint"></span></div><h2>Products</h2><div id="plist"></div><div class="row"><button class="ghost" onclick="addProd()">+ Add</button><button onclick="saveProd()">Save</button></div><h2>Q Buy</h2><div id="qbuy"></div><div class="row"><button class="ghost" onclick="addQ('buy')">+ Add</button></div><h2>Q Error</h2><div id="qerr"></div><div class="row"><button class="ghost" onclick="addQ('error')">+ Add</button><button onclick="saveQ()">Save</button></div><h2>Settings</h2><div class="card"><div class="grid2" id="sset"></div><div class="row" style="margin-top:10px"><button onclick="saveSet()">Save settings</button></div></div><h2>Tickets</h2><div class="card"><table><thead><tr><th>#</th><th>kind</th><th>user</th><th>product</th><th>status</th><th>created</th></tr></thead><tbody id="tbody"></tbody></table></div></div></div><script src="/static/dash.js"></script></body></html>
